# Janua OIDC client bootstrap — Coupler gateway
#
# STATUS: not yet registered. Registered by an org admin against
# https://auth.madfam.io; see the private ceremony runbook in
# madfam-org/internal-devops (runbooks/angelia-g4-janua-clients.md), which
# registers the sibling angelia clients on the same model.
#
# SHAPE: this is Janua's CLI manifest envelope (apiVersion/kind/metadata/spec),
# validated by janua packages/cli/src/manifest/schema.ts and, server-side, by
# apps/api/app/schemas/oauth_client.py (OAuthClientCreate). Apply with:
#   janua provision apply -f janua.client.yaml --api-url https://auth.madfam.io
# `--api-url` is MANDATORY: `apply` ignores JANUA_API_URL (janua issue #568) and
# otherwise silently POSTs to http://localhost:4100.
#
# NO client_id HERE. Janua generates the public identifier with the `jnc_`
# prefix and returns it at registration; the literal "coupler-gateway" is this
# client's metadata.name and audience, not its client_id. A `spec.client_id`
# would have to match ^jnc_[A-Za-z0-9_-]{8,56}$ and is only for pinning an id
# that already exists. The previous version of this file set
# `client_id: coupler-gateway`, which fails the CLI schema outright.
#
# ── ONE AUDIENCE PER CALLER (owner ruling, amended 2026-08-27) ──────────────
#
# `aud` names the CALLER, not just the resource. Every caller of the Coupler
# API carries its OWN audience, which makes `aud` an auditable caller identity
# at the gateway door:
#
#   coupler-api      Angelia/Moirai's execution calls into Coupler, via the
#                    angelia-coupler client (angelia repo,
#                    janua.coupler.client.yaml).
#   coupler-gateway  THIS client — the gateway's own internal operations.
#
# Coupler's verifier accepts the SET of both
# (apps/gateway/internal/auth/jwks.go, audienceOK). Adding a caller means
# registering a new audience and adding it to that set — never re-using an
# existing caller's audience.
#
# WHY NOT SHARE `coupler-api`: Janua reconciles registrations on `audience`
# alone (apps/api/app/routers/v1/oauth_clients.py:78-91,
# `registration_key = client_key or audience`; there is no client_key column).
# Two clients registered under one audience do NOT get two rows — the second
# apply silently returns 200 and OVERWRITES the first client's row: name,
# scopes, grants and redirect URIs all reconciled onto it. Proven by unit test
# against Janua's real code on 2026-08-27 (janua issue filed). `client_key`
# does NOT rescue this: supplying one that differs from `audience` is rejected
# 400 ("client_key must match audience until a separate client key column
# exists"), so it is an alias, not a distinct-caller key.
apiVersion: janua.dev/v1
kind: OAuthClient
metadata:
  name: coupler-gateway
spec:
  # This client's own caller identity. Distinct from `coupler-api`, which
  # belongs to angelia-coupler. Also Janua's registration idempotency key.
  audience: coupler-gateway
  description: Coupler gateway — internal service operations and delegated tool execution
  # NO redirect_uris. The gateway exposes no OAuth callback route: its only
  # routes are /health and /v1/tools* (apps/gateway/internal/server/server.go).
  # The previous version of this file claimed
  # https://coupler-api.madfam.io/oauth/callback, which does not exist.
  #
  # Both the CLI (schema.ts superRefine) and the server
  # (validate_redirects_for_grants) require redirect_uris only when grant_types
  # include authorization_code or implicit — see the grant_types note below.
  redirect_uris: []
  allowed_scopes:
    - openid
    - profile
    - email
    # TWO SEGMENTS, NOT THREE. Janua's server-side validator is
    # ^[a-z][a-z0-9_]*:[a-z][a-z0-9_]*$ — namespace:action, exactly one colon.
    # The former three-segment names were rejected 422 at registration.
    # Owner ruling 2026-08-26 (F5): the consumer adapts to the platform
    # grammar. Mapping old -> new:
    #   coupler:tools:execute     -> coupler:tools_execute
    #   coupler:connections:read  -> coupler:connections_read
    - coupler:tools_execute
    - coupler:connections_read
  grant_types:
    # Machine-to-machine only. The gateway runs no interactive login: it
    # VERIFIES inbound RS256 JWTs (apps/gateway/internal/auth/jwks.go) and, for
    # outbound calls to Janua's delegation API, sends an opaque
    # X-Service-Token header (apps/gateway/internal/janua/client.go) rather
    # than a Janua-minted OIDC token.
    #
    # authorization_code was dropped along with the fictional callback URI: no
    # code path in this repo initiates one, and keeping it would force a
    # redirect_uris entry that resolves to nothing.
    - client_credentials
  is_confidential: true
#
# Fields Janua's schema does not carry, kept here as the record of intent
# (the CLI schema is not .strict(), so leaving them in the spec would be a
# silent no-op rather than an error — they are comments deliberately):
#
#   post_logout_redirect_uris: https://coupler.madfam.io
#   token_endpoint_auth_method: client_secret_post   (Janua's discovery doc
#       advertises this; it is not a per-client registration field.)
#   issuer:   https://auth.madfam.io
#   jwks_uri: https://auth.madfam.io/.well-known/jwks.json
#
# Notes carried over from the previous version of this file:
#   Service-to-service: gateway uses client_credentials for internal ops.
#   User delegated execute: requires Janua's ConnectedAccount delegation API,
#   which the gateway reaches with X-Service-Token + X-Acting-User-Id
#   (internal/janua/client.go, DelegateToken). Coupler NEVER persists a refresh
#   token — delegation is per-execution and short-TTL.
#
# Secret handling: Janua returns the `jns_…` client_secret ONCE at creation and
# never again. It exists nowhere in Git.
