name: Staging — build & deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/gateway/**"
      - "apps/landing/**"
      - "connectors/**"
      - "k8s/**"
      - "scripts/**"
      - ".github/workflows/staging-deploy.yml"
      - "!k8s/overlays/staging/kustomization.yaml"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual staging deploy"
        required: true
        type: string

concurrency:
  group: coupler-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-gateway:
    name: Build gateway
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/gateway/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/madfam-org/coupler-gateway:staging-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.5.3

      # Retry the sign call: GitHub's OIDC endpoint transiently returns
      # non-JSON ("invalid character 'u' looking for beginning of value"),
      # which killed crea-frontend run 33010085743 on 2026-08-26 after the
      # image was already built and pushed, stranding the digest pin.
      - name: Sign gateway image digest
        id: sign
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/madfam-org/coupler-gateway@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          signed=0
          for wait in 0 20 60; do
            if [ "$wait" -gt 0 ]; then
              echo "::warning::cosign sign failed for ${IMAGE_REF} (transient OIDC/Fulcio/Rekor?); retrying in ${wait}s..."
              sleep "$wait"
            fi
            if cosign sign --yes "${IMAGE_REF}"; then
              signed=1
              break
            fi
          done
          if [ "$signed" -ne 1 ]; then
            echo "::error::cosign sign failed 3 times for ${IMAGE_REF}."
            echo "::error::The image was BUILT AND PUSHED but is NOT signed, so it will not be"
            echo "::error::pinned and ArgoCD will not roll it: the live host is still serving the"
            echo "::error::PREVIOUS build even though this commit is on main. Rerun the failed jobs."
            exit 1
          fi

  build-landing:
    name: Build landing
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/landing/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/madfam-org/coupler-landing:staging-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=landing
          cache-to: type=gha,scope=landing,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.5.3

      # Retry the sign call: GitHub's OIDC endpoint transiently returns
      # non-JSON ("invalid character 'u' looking for beginning of value"),
      # which killed crea-frontend run 33010085743 on 2026-08-26 after the
      # image was already built and pushed, stranding the digest pin.
      - name: Sign landing image digest
        id: sign
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/madfam-org/coupler-landing@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          signed=0
          for wait in 0 20 60; do
            if [ "$wait" -gt 0 ]; then
              echo "::warning::cosign sign failed for ${IMAGE_REF} (transient OIDC/Fulcio/Rekor?); retrying in ${wait}s..."
              sleep "$wait"
            fi
            if cosign sign --yes "${IMAGE_REF}"; then
              signed=1
              break
            fi
          done
          if [ "$signed" -ne 1 ]; then
            echo "::error::cosign sign failed 3 times for ${IMAGE_REF}."
            echo "::error::The image was BUILT AND PUSHED but is NOT signed, so it will not be"
            echo "::error::pinned and ArgoCD will not roll it: the live host is still serving the"
            echo "::error::PREVIOUS build even though this commit is on main. Rerun the failed jobs."
            exit 1
          fi

  update-staging:
    name: Patch staging overlay digests
    needs: [build-gateway, build-landing]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch digests
        id: pin
        run: |
          SHORT="$(git rev-parse --short HEAD)"
          FILE="k8s/overlays/staging/kustomization.yaml"
          python3 scripts/patch-kustomize-digest.py "$FILE" ghcr.io/madfam-org/coupler-gateway "${{ needs.build-gateway.outputs.digest }}"
          python3 scripts/patch-kustomize-digest.py "$FILE" ghcr.io/madfam-org/coupler-landing "${{ needs.build-landing.outputs.digest }}"
          git config user.name "coupler-bot"
          git config user.email "bot@madfam.io"
          git add "$FILE"
          git commit -m "deploy(staging): gateway+landing $SHORT"
          git pull --rebase origin main
          git push

      # Loud-stale guard (2026-08-26 crea-frontend OIDC incident): a build that
      # pushes an image but dies before the digest lands leaves main green while
      # the cluster keeps the old build. Name that failure mode explicitly.
      - name: Fail loudly if images pushed but not pinned
        if: always()
        run: |
          if [ "${{ needs.build-gateway.result }}" != "success" ] || [ "${{ needs.build-landing.result }}" != "success" ] || [ "${{ steps.pin.outcome }}" != "success" ]; then
            echo "::error title=Image pushed but NOT pinned/deployed::The coupler gateway/landing images for ${{ github.sha }} may have been built and pushed to GHCR, but signing or the staging overlay digest patch did not complete. ArgoCD was never handed a new digest, so THE LIVE HOST IS STILL SERVING THE PREVIOUS BUILD even though this commit is green on main. Rerun the failed jobs (gh run rerun ${{ github.run_id }} --failed)."
            exit 1
          fi
